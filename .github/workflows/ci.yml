name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check contribution target
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$EVENT" != pull_request || "$BASE" == develop ]]; then
            exit 0
          fi
          if [[ "$BASE" == main && "$HEAD" == develop && "$HEAD_REPO" == "$REPO" && "$AUTHOR" == Kb2uka ]]; then
            exit 0
          fi
          echo 'Contributor PRs must target develop. Only the maintainer promotes develop to main.' >&2
          exit 1

  tests:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4 device-tree-compiler
      - name: Check whitespace in proposed change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Run offline regression suite
        env:
          LUA: lua5.4
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  macos:
    name: Installer transport (macOS)
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Run downloader and packaging regressions on macOS
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p test_j713_download.py -v
