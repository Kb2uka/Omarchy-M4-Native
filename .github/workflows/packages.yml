name: Packages

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Package channel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends makepkg pacman-package-manager libarchive-tools fakeroot zstd gnupg && sudo mkdir -p /var/lib/pacman/local && echo 9 | sudo tee /var/lib/pacman/local/ALPM_DB_VERSION
      - name: Build packages
        run: python3 tools/build-m4-packages.py --out "$RUNNER_TEMP/packages"
      - name: Check package policy and published versions
        run: python3 tools/check-m4-packages.py "$RUNNER_TEMP/packages"
      - name: Install through a signed sandbox repository
        run: python3 tools/ci/m4-channel-e2e.py "$RUNNER_TEMP/packages"

  publish:
    name: Publish package channel
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: package-publish
    permissions:
      contents: write
    concurrency:
      group: package-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends makepkg pacman-package-manager libarchive-tools fakeroot zstd gnupg && sudo mkdir -p /var/lib/pacman/local && echo 9 | sudo tee /var/lib/pacman/local/ALPM_DB_VERSION
      - name: Build packages
        run: python3 tools/build-m4-packages.py --out "$RUNNER_TEMP/packages"
      - name: Check package policy and published versions
        run: python3 tools/check-m4-packages.py "$RUNNER_TEMP/packages"
      - name: Sign and publish
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/publish-m4-packages.py "$RUNNER_TEMP/packages"
