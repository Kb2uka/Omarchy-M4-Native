# J713 headphone jack (omarchy-m4-headphones). Not part of the protected
# speaker policy: a new file, a new script and an optional component.
#
# Matches the UCM node only (PlaybackPCM hw:J713Headphones,0). If UCM is
# missing, ACP's jack-less fallback node keeps its own name, so the hook below
# never forces it as the default.
monitor.alsa.rules = [
  {
    matches = [
      {
        api.alsa.path = "hw:J713Headphones,0"
        media.class = "Audio/Sink"
      }
    ]
    actions = {
      update-props = {
        node.name = "alsa_output.j713.Headphones"
        node.description = "Headphones"
        node.nick = "Headphones"
      }
    }
  }
]

wireplumber.components = [
  {
    name = default-nodes/j713-headphones.lua
    type = script/lua
    provides = hooks.default-nodes.j713-headphones
  }
]

# Never required: a broken headphone hook must not stop WirePlumber, and with
# it the speakers. In WirePlumber 0.5 "optional" is every feature's default
# and loads nothing by itself, so the stock default-nodes policy pulls the hook
# in as a soft dependency (wants: a load failure is only a warning). merge
# appends to the stock wants list.
wireplumber.components.rules = [
  {
    matches = [ { provides = "policy.default-nodes" } ]
    actions = {
      merge = {
        wants = [ hooks.default-nodes.j713-headphones ]
      }
    }
  }
]

wireplumber.profiles = {
  main = {
    hooks.default-nodes.j713-headphones = optional
  }
}
