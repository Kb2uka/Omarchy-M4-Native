SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
		JackControl "Headphone Jack"
		PlaybackVolume "Jack DAC Playback Volume"
		PlaybackMixerElem "Jack DAC"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"
	Value {
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
		CaptureRate 48000
		JackControl "Headset Mic Jack"
		CaptureVolume "Jack ADC PGA Capture Volume"
		CaptureMixerElem "Jack ADC PGA"
	}
	EnableSequence [
		cset "name='Jack SDOUT1 Select' ADC"
		cset "name='Jack ADC Preamp Capture Volume' 0"
		cset "name='Jack ADC HPF Switch' on"
	]
}
