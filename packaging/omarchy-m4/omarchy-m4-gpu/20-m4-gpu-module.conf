# Installed by omarchy-m4-gpu. Applies the fixed Air GPU module (#57, #118) before
# m4-gpu-start checks and loads it; a refusal never stops graphics startup.
# alpha.1's unit sends this output to /tmp/m4-gpu-start.log, which a restart
# clears; the journal keeps it with the unit, where the failure notice looks.
[Service]
ExecStartPre=-/usr/bin/m4-gpu-module --boot
StandardOutput=journal
StandardError=journal
