[Unit]
After=m4-gpu.service m4-video.service m4-j713-audio-register.service

[Service]
Environment=TERM=linux
# Keep kernel diagnostics in the journal while the interactive form owns tty1.
# Restore console output on success and on any failed or interrupted setup.
ExecStartPre=-/usr/bin/dmesg --console-off
ExecStartPost=-/usr/bin/dmesg --console-on
ExecStopPost=-/usr/bin/dmesg --console-on
